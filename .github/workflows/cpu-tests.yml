name: CPU tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 python -m pytest -q
